<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Presença - Quick Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        #signature-pad { 
            border: 2px dashed #ccc; 
            background: #fff; 
            width: 100%; 
            height: 250px; 
            border-radius: 10px; 
            touch-action: none; 
        }
        .btn-quick { background-color: #e63946; color: white; font-weight: bold; border-radius: 8px; }
        .btn-quick:hover { background-color: #c12e3a; color: white; }
        .footer-credits { font-size: 0.75rem; color: #888; margin-top: 25px; line-height: 1.4; border-top: 1px solid #eee; }
        #loadingModal .modal-content { background: none; border: none; }
        .modal-header { border-bottom: none; }
        .modal-footer { border-top: none; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4" id="mainCard">
                <div id="formContent">
                    <div class="text-center mb-4">
                        <img src="https://quickdelivery.com.br/wp-content/uploads/2025/09/logo-quick-delivery-solucoes-em-logistica.webp" style="max-width: 150px;">
                        <h3 class="text-danger fw-bold mt-2">Lista de Presença</h3>
                        <p class="text-muted small" id="displayReuniao"></p>
                    </div>

                    <form id="attendanceForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nome Completo:</label>
                            <input type="text" id="nome" class="form-control" required placeholder="Digite seu nome">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Sua Filial:</label>
                            <select id="filial" class="form-select" required>
                                <option value="">Carregando filiais...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Assinatura (Rubrica):</label>
                            <canvas id="signature-pad"></canvas>
                            <button type="button" class="btn btn-sm btn-outline-secondary mt-2 w-100" onclick="signaturePad.clear()">Limpar Assinatura</button>
                        </div>
                        <button type="submit" class="btn btn-quick w-100 py-3 mt-3 shadow">Confirmar Presença</button>
                    <div class="footer-credits text-center mt-4 pt-3">
                            <div>Responsável: <strong>Gilberto Ribeiro</strong> </div>
                            <div>Desenvolvido por: <strong>Luiz Gustavo</strong></div>
                            <div class="fw-bold mt-1 text-danger">Quick Delivery © 2026</div>
                        </div>
                    </form>
                    
                </div>

                <div id="successMessage" class="text-center py-5 d-none">
                    <div class="mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="#28a745" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                        </svg>
                    </div>
                    <h3 class="text-success fw-bold">Presença Confirmada!</h3>
                    <p class="text-muted">Seu registro foi enviado com sucesso.</p>
                    <button class="btn btn-outline-primary mt-3" onclick="location.reload()">Novo Registro</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="loadingModal" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered text-center text-white">
        <div class="modal-content">
            <div class="spinner-border text-danger mx-auto" style="width: 3rem; height: 3rem;" role="status"></div>
            <h4 class="mt-3 fw-light">Registrando presença...</h4>
        </div>
    </div>
</div>

<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered text-center">
        <div class="modal-content p-4">
            <h4 class="mb-3 text-danger fw-bold" id="statusTitle">Aviso</h4>
            <p id="statusBody" class="text-muted"></p>
            <button type="button" class="btn btn-quick w-100 py-2 shadow-sm" data-bs-dismiss="modal">Fechar</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const reuniaoId = urlParams.get('id') || 'Geral'; 
    document.getElementById('displayReuniao').innerText = "Reunião: " + reuniaoId;

    if (localStorage.getItem('presenca_' + reuniaoId)) {
        document.getElementById('formContent').innerHTML = "<div class='text-center p-5'><h4>Sua presença já foi registrada para esta reunião!</h4><button class='btn btn-sm btn-link text-decoration-none' onclick='localStorage.clear(); location.reload();'>Limpar trava (Teste)</button></div>";
    }

    const canvas = document.getElementById('signature-pad');
    const signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgb(255, 255, 255)' });

    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        signaturePad.clear(); 
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));
    const statusModal = new bootstrap.Modal(document.getElementById('statusModal'));

    async function loadBranches() {
        const apiURL = 'https://quickdelivery.luizgustavo.tech/api/branches/';
        const apiToken = 'YOUR_X_API_KEY_HERE';
        try {
            const response = await fetch(apiURL, {
                headers: { 'X-Api-Key': apiToken }
            });
            const data = await response.json();
            const select = document.getElementById('filial');
            select.innerHTML = '<option value="">Selecione sua unidade...</option>';
            data.branches.forEach(b => {
                select.innerHTML += `<option value="${b.name}">${b.name}</option>`;
            });
        } catch (err) {
            console.error("Erro ao carregar filiais:", err);
            document.getElementById('filial').innerHTML = '<option value="">Erro ao carregar unidades</option>';
        }
    }

    loadBranches();

    function showStatus(title, body) {
        document.getElementById('statusTitle').innerText = title;
        document.getElementById('statusBody').innerText = body;
        statusModal.show();
    }

    document.getElementById('attendanceForm').onsubmit = async (e) => {
        e.preventDefault();
        
        if (signaturePad.isEmpty()) {
            showStatus("Pendente", "Por favor, faça sua assinatura antes de confirmar.");
            return;
        }

        loadingModal.show();

        const payload = {
            nome: document.getElementById('nome').value,
            filial: document.getElementById('filial').value,
            reuniaoId: reuniaoId,
            assinatura: signaturePad.toDataURL() 
        };

        // URL DO SEU BACKEND DJANGO (Hospedado no seu VPS)
        const scriptURL = 'https://quickdelivery.luizgustavo.tech/api/submit-attendance/';
        const apiToken = 'YOUR_X_API_KEY_HERE';

        try {
            const response = await fetch(scriptURL, { 
                method: 'POST', 
                headers: {
                    'Content-Type': 'application/json',
                    'X-Api-Key': apiToken
                },
                body: JSON.stringify(payload) 
            });

            const result = await response.json();

            if (response.ok) {
                localStorage.setItem('presenca_' + reuniaoId, 'true');
                
                setTimeout(() => {
                    loadingModal.hide();
                    document.getElementById('formContent').classList.add('d-none');
                    document.getElementById('successMessage').classList.remove('d-none');
                }, 1000);
            } else {
                loadingModal.hide();
                showStatus("Erro no registro", result.error || "Algo deu errado. Tente novamente.");
            }

        } catch (err) {
            loadingModal.hide();
            showStatus("Erro de Conexão", "Verifique se o backend está online. Não foi possível registrar.");
        }
    };
</script>
</body>
</html>
