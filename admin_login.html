<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Capelão - Quick Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-quick { background-color: #e63946; color: white; font-weight: bold; }
        .btn-quick:hover { background-color: #c12e3a; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card p-4 mt-5">
                <div class="text-center mb-4">
                    <img src="https://quickdelivery.com.br/wp-content/uploads/2025/09/logo-quick-delivery-solucoes-em-logistica.webp" style="max-width: 150px;">
                    <h3 class="text-danger fw-bold mt-3">Painel Capelão</h3>
                </div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input type="text" id="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-quick w-100 py-2">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered text-center">
        <div class="modal-content p-4">
            <h4 class="mb-3 text-danger fw-bold" id="statusTitle">Erro</h4>
            <p id="statusBody"></p>
            <button type="button" class="btn btn-quick w-100" data-bs-dismiss="modal">Fechar</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const CONFIG = {
        API_URL: 'https://quickdelivery.luizgustavo.tech/api'
    };

    const statusModal = new bootstrap.Modal(document.getElementById('statusModal'));
    function showError(msg) {
        document.getElementById('statusBody').innerText = msg;
        statusModal.show();
    }

    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const payload = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch(`${CONFIG.API_URL}/login/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('admin_token', data.token);
                localStorage.setItem('admin_user', data.username);
                window.location.href = 'admin_dashboard.html';
            } else {
                showError(data.error || 'Falha no login');
            }
        } catch (err) {
            showError('Erro de conexão com o servidor.');
        }
    };
</script>
</body>
</html>
