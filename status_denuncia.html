<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acompanhar Denúncia - Quick Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-quick { background-color: #e63946; color: white; font-weight: bold; }
        .btn-quick:hover { background-color: #c12e3a; color: white; }
        .status-badge { padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em; }
        .chat-bubble { padding: 15px; border-radius: 12px; margin-bottom: 15px; max-width: 85%; }
        .chat-admin { background-color: #e63946; color: white; align-self: flex-start; }
        .chat-user { background-color: #e9ecef; color: #333; align-self: flex-end; margin-left: auto; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div id="searchArea" class="card p-5 text-center shadow-lg">
                <img src="https://quickdelivery.com.br/wp-content/uploads/2025/09/logo-quick-delivery-solucoes-em-logistica.webp" style="max-width: 150px;" class="mx-auto mb-4">
                <h3 class="fw-bold mb-3">Acompanhar Denúncia</h3>
                <p class="text-muted">Insira o código do seu ticket para ver o progresso.</p>
                <div class="input-group mb-4">
                    <input type="text" id="ticketInput" class="form-control form-control-lg text-center fw-bold text-uppercase" placeholder="EX: QUICK-X8YJ2">
                    <button class="btn btn-quick px-4" onclick="checkStatus()">Buscar</button>
                </div>
                <p class="small text-muted"><i class="bi bi-info-circle me-1"></i> Se você perdeu seu código, será necessário registrar uma nova denúncia.</p>
            </div>

            <div id="statusArea" class="d-none">
                <div class="card p-4 mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold m-0 text-danger" id="ticketDisplay">---</h5>
                        <span id="statusBadge" class="badge bg-secondary p-2">Status</span>
                    </div>
                    <div class="row small text-muted border-top border-bottom py-2 my-2">
                        <div class="col-6"><strong>Categoria:</strong> <span id="catDisplay">--</span></div>
                        <div class="col-6 text-end"><strong>Urgência:</strong> <span id="urgDisplay">--</span></div>
                    </div>
                    <p class="mt-3 mb-0"><strong>Seu Relato:</strong></p>
                    <p class="text-muted italic" id="descDisplay">...</p>
                </div>

                <h6 class="fw-bold mb-3"><i class="bi bi-chat-dots me-2"></i>Histórico e Respostas</h6>
                <div id="updatesContainer" class="d-flex flex-column">
                    <div class="text-center py-4 bg-white rounded border">
                        <p class="mb-0 text-muted">Aguardando análise pelo Capelão...</p>
                    </div>
                </div>
                
                <button class="btn btn-outline-secondary w-100 mt-4" onclick="location.reload()">Nova Consulta</button>
            </div>
        </div>
    </div>
</div>

<script>
    const CONFIG = { API_URL: 'https://gilberto.luizgustavo.tech/api' };

    async function checkStatus() {
        const ticket = document.getElementById('ticketInput').value.trim().toUpperCase();
        if (!ticket) return;

        try {
            const res = await fetch(`${CONFIG.API_URL}/complaints/check/${ticket}/`);
            const data = await res.json();
            
            if (!res.ok) {
                alert('Ticket não encontrado ou inválido.');
                return;
            }

            document.getElementById('searchArea').classList.add('d-none');
            document.getElementById('statusArea').classList.remove('d-none');

            document.getElementById('ticketDisplay').innerText = data.ticket_id;
            document.getElementById('statusBadge').innerText = data.status;
            document.getElementById('catDisplay').innerText = data.category;
            document.getElementById('urgDisplay').innerText = data.urgency;
            document.getElementById('descDisplay').innerText = data.description;

            const container = document.getElementById('updatesContainer');
            container.innerHTML = '';
            
            if (data.updates.length === 0) {
                container.innerHTML = '<div class="text-center py-4 bg-white rounded border"><p class="mb-0 text-muted">Seu relato foi recebido e está em fila para análise.</p></div>';
            } else {
                data.updates.forEach(u => {
                    const typeClass = u.is_admin ? 'chat-admin' : 'chat-user';
                    container.innerHTML += `
                        <div class="chat-bubble ${typeClass}">
                            <div class="small fw-bold border-bottom mb-1 pb-1">${u.is_admin ? 'Capelão' : 'Você'}</div>
                            ${u.message}
                            <div class="text-end small mt-1" style="font-size: 0.7em; opacity: 0.8;">${u.created_at}</div>
                        </div>
                    `;
                });
            }
        } catch (err) { alert('Erro ao buscar status.'); }
    }
</script>
</body>
</html>
